<nav></nav>
<main></main>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
<script>
  
  let currentGif = 'images/flower.gif'
  
 //this is the function that makes gifs
  function imageGif () {
    if (!nn.mouseDown) return
    let x = nn.mouseX
    let y = nn.mouseY

    nn.create('img')
      .set ('src', currentGif)
      .addTo('main')
      .positionOrigin('center')
      .position(x, y)
      .css('user-select', 'none')
  }
  
  nn.on('mousemove', imageGif)

  function setup () {
  nn.create('button')
    .content('🐧')
    .addTo('nav')
    .on('click', updatePenguin)
  // ^ when we click the button,
  // we call the update() function
  nn.create('button')
    .content('⭐')
    .addTo ('nav')
    .on('click', updateStar)
  nn.create('button')
    .content('🌸')
    .addTo ('nav')
    .on('click', updateFlower)
}
  function updatePenguin () {
    currentGif = 'images/penguin.gif'
  }
  
  function updateFlower () {
    currentGif = 'images/flower.gif'
}

  function updateStar () {
    currentGif = 'images/star.gif'
  }
nn.on('load', setup)
  
  
</script>
