<nav></nav>
<main></main>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
<script>
  
  let currentGif = 'images/flower.gif'
  
 //this is the function that makes gifs
  function imageGif () {
    if (!nn.mouseDown) return
    let x = nn.mouseX
    let y = nn.mouseY
    if (nn.mouseY < nn.get ('nav').height) return

    nn.create('img')
      .set ('src', currentGif)
      .addTo('main')
      .positionOrigin('center')
      .position(x, y)
      .css('user-select', 'none')
      .css('pointer-events', 'none')
  }
  
  nn.on('mousemove', imageGif)

  function setup () {
  // ^ when we click the button,
  // we call the update() function
  nn.create('button')
    .content('⭐')
    .addTo ('nav')
    .on('click', updateStar)
  nn.create('button')
    .content('🌸')
    .addTo ('nav')
    .on('click', updateFlower)
  nn.create('button')
    .content('⚘')
    .addTo ('nav')
    .on('click', updateBlueFlower)
   nn.create ('button')
    .content('🎈')
    .addTo ('nav')
    .on('click', updateBalloon)
  nn.create('button')
    .content('🗑️')
    .addTo ('nav')
    .on('click', emptyScreen)
    
}
  function updateFlower () {
    currentGif = 'images/flower.gif'
}

  function updateStar () {
    currentGif = 'images/star2.gif'
  }
  
  function updateBlueFlower () {
    currentGif = 'images/blueflower.gif'
  }
  
  function updateBalloon () {
    currentGif = 'images/balloon.gif'
  }
  
  function emptyScreen () {
    nn.get('main')
    .content ('')
  }
nn.on('load', setup)
  
  
</script>
